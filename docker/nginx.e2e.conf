# Local stand-in for the AWS load balancer, in front of two app servers.
#
# Like the ALB: new visitors are spread across both servers, WebSockets pass through,
# and a server that stops answering is skipped. Like the ALB's sticky cookie, a visitor
# can be pinned to one server — here with the cookie `lb_server=a|b` — and is moved to
# the other one when that server goes away (`backup`).

upstream app_any {
  server app-a:3000 max_fails=1 fail_timeout=5s;
  server app-b:3000 max_fails=1 fail_timeout=5s;
}
upstream app_prefer_a {
  server app-a:3000 max_fails=1 fail_timeout=5s;
  server app-b:3000 backup;
}
upstream app_prefer_b {
  server app-b:3000 max_fails=1 fail_timeout=5s;
  server app-a:3000 backup;
}

map $cookie_lb_server $app_pool {
  a       app_prefer_a;
  b       app_prefer_b;
  default app_any;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  client_max_body_size 11m;

  location / {
    proxy_pass http://$app_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    # Streamed answers (the assistant) go out as they're written.
    proxy_buffering off;
    # A server that's gone: try the next one. A stopped container's address goes silent
    # rather than refusing, so don't wait the default 60s to find out.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;
  }
}
