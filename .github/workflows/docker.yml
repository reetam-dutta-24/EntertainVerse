name: Docker image

# Every push to main publishes a fresh image; it can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # lets the built-in token push to GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest = what the servers run; the commit SHA = a fixed version to roll back to
          tags: |
            ghcr.io/${{ github.repository_owner }}/entertainverse:latest
            ghcr.io/${{ github.repository_owner }}/entertainverse:${{ github.sha }}
          # Reuse unchanged layers (npm install etc.) between runs: much faster rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
