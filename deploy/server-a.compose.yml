# Server A (entertainVerse-server1-prod): app + Postgres + Redis.
# Server B's app reaches Postgres and Redis through A's private IP; the data-sg
# security group only lets the app servers in.
name: entertainverse

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: entertainverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: entertainverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Listen on the private network only, never the public address.
    ports: ["${PRIVATE_IP}:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "entertainverse"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["${PRIVATE_IP}:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 20

  app:
    image: ghcr.io/reetam-dutta-24/entertainverse:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_NAME: a
      DATABASE_URL: postgresql://entertainverse:${POSTGRES_PASSWORD}@postgres:5432/entertainverse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_URL: ${APP_URL}
      NEXTAUTH_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Room for the graceful shutdown (10s drain) before Docker kills it.
    stop_grace_period: 30s

volumes:
  pgdata:
