# Server B (entertainVerse-server2-prod): the app only. Its data lives on server A.
name: entertainverse

services:
  app:
    image: ghcr.io/reetam-dutta-24/entertainverse:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_NAME: b
      DATABASE_URL: postgresql://entertainverse:${POSTGRES_PASSWORD}@${SERVER_A_IP}:5432/entertainverse
      REDIS_URL: redis://:${REDIS_PASSWORD}@${SERVER_A_IP}:6379
      AUTH_URL: ${APP_URL}
      NEXTAUTH_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    ports: ["3000:3000"]
    stop_grace_period: 30s
