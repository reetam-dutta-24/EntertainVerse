# The production layout on one machine, for end-to-end tests: two app servers sharing
# Postgres, Redis and S3, behind a load balancer.
#
#   browser ──► lb (:8080) ──► app-a ─┐
#                         └──► app-b ─┼──► postgres, redis, s3
#
# Run it with `npm run test:e2e:stack` (builds the image, resets the database, starts
# everything, runs the tests). Each server is also reachable on its own (:3201, :3202),
# so tests can put two users on different servers on purpose.
name: entertainverse-e2e

x-app: &app
  image: entertainverse:local
  environment: &app-env
    DATABASE_URL: postgresql://test:test@postgres:5432/entertainverse_e2e
    REDIS_URL: redis://redis:6379
    S3_BUCKET: entertainverse-media
    S3_ENDPOINT: http://s3:9090
    S3_REGION: us-east-1
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    AUTH_SECRET: e2e-only-secret-not-for-production-use
    NEXTAUTH_SECRET: e2e-only-secret-not-for-production-use
    AUTH_URL: http://localhost:8080
    NEXTAUTH_URL: http://localhost:8080
    NEXT_PUBLIC_APP_URL: http://localhost:8080
    # Shorter than production's 10s; nginx notices a gone server at once.
    SHUTDOWN_DRAIN_MS: "3000"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3: { condition: service_started }
  # Room for the graceful shutdown before Docker kills the process.
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: entertainverse_e2e
    # The tests reset and seed it from the host.
    ports: ["55434:5432"]
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "entertainverse_e2e"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # S3-compatible stand-in for the uploads bucket.
  s3:
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: entertainverse-media

  app-a:
    <<: *app
    environment:
      <<: *app-env
      SERVER_NAME: a
    ports: ["3201:3000"]

  app-b:
    <<: *app
    environment:
      <<: *app-env
      SERVER_NAME: b
    ports: ["3202:3000"]

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [app-a, app-b]
